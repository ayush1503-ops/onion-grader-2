# Tells Vercel's "uv" installer exactly what to install (and pins it).
# package = false -> this is an APPLICATION, not an installable library.
[project]
name = "onion-grader"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0",
  "opencv-python-headless==4.11.0.86",
  "numpy==2.2.6",
  "pillow==11.2.1",
]

[tool.uv]
package = false
