[project]
name = "onion-grader"
version = "0.1.0"
description = "AI Onion Quality Grading (SIH26031) - Flask app with CV pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0.0",
    "opencv-python-headless==4.11.0.86",
    "numpy==2.2.6",
    "pillow==11.2.1",
    "waitress>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
